<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HGU-Lab | Analyst Library</title>
<style>
:root{--navy:#102b4e;--blue:#2463a6;--sky:#eaf2fb;--ink:#17283d;--muted:#6b7b8e;--line:#dce5ef;--bg:#f5f8fc;--white:#fff}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;color:var(--ink);background:var(--bg)}
header{background:linear-gradient(125deg,#102b4e,#1f5794);color:white;padding:28px clamp(18px,5vw,64px) 34px}
.top{display:flex;align-items:center;justify-content:space-between;gap:16px}.brand{font-weight:800;letter-spacing:.08em;font-size:15px}.tag{font-size:11px;letter-spacing:.15em;opacity:.75}
.hero{margin-top:36px;max-width:900px}.hero small{color:#a9d0ff;letter-spacing:.18em;font-weight:700}.hero h1{font-size:clamp(28px,5vw,46px);line-height:1.2;margin:12px 0}.hero p{color:#d9e7f7;line-height:1.8;margin:0;max-width:650px}
main{max-width:1240px;margin:auto;padding:28px clamp(16px,4vw,48px) 60px}
.toolbar{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:22px}.search{flex:1;min-width:220px}.search input{width:100%}
input,select,textarea{font:inherit;border:1px solid var(--line);background:white;border-radius:10px;padding:12px;color:var(--ink);outline:none}input:focus,select:focus,textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px #2463a61a}
button{font:inherit;border:0;border-radius:10px;padding:12px 16px;cursor:pointer;font-weight:700}.primary{background:var(--blue);color:white}.secondary{background:white;border:1px solid var(--line);color:var(--navy)}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 24px}.filter{background:white;border:1px solid var(--line);color:var(--muted);padding:9px 13px;font-size:13px}.filter.active{background:var(--navy);color:white;border-color:var(--navy)}
.sectionhead{display:flex;justify-content:space-between;align-items:end;margin:26px 0 16px;gap:10px}.sectionhead h2{margin:0;font-size:21px}.sectionhead span{color:var(--muted);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.card{background:white;border:1px solid var(--line);border-radius:16px;padding:19px;display:flex;flex-direction:column;min-height:220px;box-shadow:0 4px 16px #132b4e05;transition:transform .15s,box-shadow .15s}.card:hover{transform:translateY(-2px);box-shadow:0 8px 22px #132b4e0c}
.cardtop{display:flex;justify-content:space-between;align-items:center;gap:8px}.category{font-size:11px;font-weight:800;color:var(--blue);background:var(--sky);padding:6px 9px;border-radius:7px}.type{font-size:11px;color:var(--muted)}
.card h3{font-size:17px;line-height:1.5;margin:14px 0 8px}.desc{font-size:13px;color:var(--muted);line-height:1.75;margin:0 0 16px}.meta{margin-top:auto;display:flex;justify-content:space-between;align-items:center;border-top:1px solid #edf1f6;padding-top:12px;color:var(--muted);font-size:11px}.open{color:var(--blue);font-weight:800;text-decoration:none}.open:hover{text-decoration:underline}
.empty{grid-column:1/-1;text-align:center;background:white;border:1px dashed var(--line);border-radius:16px;padding:42px;color:var(--muted)}
.note{font-size:12px;color:var(--muted);line-height:1.7;margin-top:22px}
.modal{display:none;position:fixed;inset:0;background:#08182bb8;z-index:10;padding:16px;overflow:auto;align-items:center;justify-content:center}.modal.show{display:flex}.dialog{width:min(620px,100%);background:white;border-radius:18px;padding:24px}.dialog h2{margin:0 0 18px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.field{display:flex;flex-direction:column;gap:7px;font-size:12px;font-weight:700;color:var(--muted)}.field.full{grid-column:1/-1}.field textarea{min-height:90px;resize:vertical}.actions{display:flex;justify-content:flex-end;gap:9px;margin-top:18px}
@media(max-width:850px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:560px){.grid{grid-template-columns:1fr}.top{align-items:flex-start}.tag{display:none}.hero{margin-top:25px}.formgrid{grid-template-columns:1fr}.field.full{grid-column:auto}.toolbar button{width:100%}}
.previewDialog{width:min(1050px,100%);max-height:95vh;display:flex;flex-direction:column}.previewFrame{width:100%;height:75vh;min-height:350px;border:1px solid var(--line);border-radius:10px;background:#f5f8fc}.previewHead{display:flex;justify-content:space-between;align-items:center;gap:12px}.previewHead h2{margin:0}.previewActions{display:flex;gap:8px;flex-wrap:wrap}.cardactions{flex-wrap:wrap}.notice{display:flex;justify-content:space-between;align-items:center;background:#eaf2fb;padding:12px;border-radius:12px;margin-bottom:16px;gap:12px}.cardactions{display:flex;gap:8px;margin-top:12px}

</style>
</head>
<body>
<header>
 <div class="top"><div class="brand">HGU-LAB <span style="font-weight:400;opacity:.7">/ ANALYST LIBRARY</span></div><div class="tag">KNOWLEDGE · DATA · INSIGHT</div></div>
 <div class="hero"><small>SHARE THE INSIGHT</small><h1>分析を、チームの知識に。</h1><p>アナリストがまとめたデータ、分析レポート、気づきや面白い資料を共有するライブラリ。<br>一人の発見を、チーム全体の力に。</p></div>
</header>
<main><div id="account" style="padding:12px;background:white;border-radius:12px;margin-bottom:16px"><button id="login" class="primary">Googleでログイン</button><button id="logout" class="secondary" style="display:none">ログアウト</button><span id="identity"></span><div id="status" style="color:#b42318;font-size:13px"></div></div><div id="content" style="display:none">
 <div class="toolbar"><div class="search"><input id="search" placeholder="資料名・内容・投稿者で検索…" aria-label="検索"></div><button class="primary" id="addBtn" style="display:none">＋ 資料を投稿</button></div>
 <div class="filters" id="filters"></div><div class="notice" id="notice"><b id="unreadCount">未読資料 0件</b> <button id="unreadBtn" class="secondary">未読だけ表示</button></div>
 <div class="sectionhead"><h2>共有ライブラリ</h2><span id="count"></span></div>
 <div class="grid" id="cards"></div>
 <p class="note">資料情報・未読情報はFirestoreで共有されます。PDFはサイト内でプレビューできます。GitHub Pagesに置いた資料はURLを知る人がログインなしでも閲覧できます。</p>
</div></main>
<div class="modal" id="modal"><div class="dialog"><h2>資料を投稿する</h2>
<form id="postForm"><div class="formgrid">
<label class="field">資料タイトル<input name="title" required maxlength="100" placeholder="例：春季リーグ 打者傾向分析"></label>
<label class="field">投稿者<input name="author" required maxlength="40" placeholder="例：アナリスト"></label>
<label class="field">カテゴリ<select name="category"><option>打撃分析</option><option>投手分析</option><option>チーム分析</option><option>パフォーマンス</option><option>研究・論文</option><option>面白い資料</option><option>その他</option></select></label>
<label class="field">資料タイプ<select name="type"><option>レポート</option><option>データ</option><option>研究資料</option><option>動画・リンク</option><option>メモ・気づき</option></select></label>
<label class="field full">概要<textarea name="desc" required maxlength="500" placeholder="資料の内容や、共有したいポイントを簡単に"></textarea></label>
<label class="field full">PDFの公開URL（任意）<input name="fileUrl" type="url" placeholder="https://hokkaigakuen.github.io/data_library/資料.pdf"></label>
<label class="field full">外部リンク（任意）<input name="url" type="url" placeholder="Google Drive / スプレッドシート / YouTube など"></label>
</div><div class="actions"><button type="button" class="secondary" id="cancel">キャンセル</button><button class="primary" type="submit">投稿する</button></div></form>
</div></div>
<div class="modal" id="previewModal" role="dialog" aria-modal="true" aria-labelledby="previewTitle"><div class="dialog previewDialog"><div class="previewHead"><h2 id="previewTitle">PDFプレビュー</h2><button class="secondary" id="closePreview" type="button">閉じる</button></div><p class="note" id="previewHint">PDFを表示しています。</p><iframe id="previewFrame" class="previewFrame" title="PDFプレビュー" loading="lazy"></iframe><div class="actions"><a id="previewExternal" class="open" target="_blank" rel="noopener noreferrer">別タブで開く</a></div></div></div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,GoogleAuthProvider,signInWithPopup,signOut,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,collection,doc,getDoc,addDoc,updateDoc,deleteDoc,setDoc,onSnapshot,query,orderBy,serverTimestamp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const cfg={apiKey:"AIzaSyDvIAyFiOLfScIu8-NPQSevfpw1BJw7hA4",authDomain:"hug-baseball-data.firebaseapp.com",projectId:"hug-baseball-data",storageBucket:"hug-baseball-data.firebasestorage.app",messagingSenderId:"28963444862",appId:"1:28963444862:web:549f3e75ff84843a81202f"};
const fb=initializeApp(cfg),auth=getAuth(fb),db=getFirestore(fb);
const adminEmail="hokkaigakuenbaseball@gmail.com";
let user=null,admin=false,approved=false,authVersion=0,reads=new Set(),onlyUnread=false,stopPosts=null,stopReads=null;
const status=s=>document.getElementById("status").textContent=s;
document.getElementById("login").onclick=async()=>{try{await signInWithPopup(auth,new GoogleAuthProvider())}catch(e){status("ログインエラー: "+e.message)}};
document.getElementById("logout").onclick=()=>signOut(auth);
document.getElementById("unreadBtn").onclick=()=>{onlyUnread=!onlyUnread;document.getElementById("unreadBtn").textContent=onlyUnread?"すべて表示":"未読だけ表示";renderCards()};
onAuthStateChanged(auth,async u=>{
 const version=++authVersion;
 hidePasswordGate();
 if(stopPosts){stopPosts();stopPosts=null;}if(stopReads){stopReads();stopReads=null;}
 user=u;admin=!!u&&u.emailVerified===true&&u.email?.toLowerCase()===adminEmail;approved=admin;
 document.getElementById("login").style.display=u?"none":"";
 document.getElementById("logout").style.display=u?"":"none";
 document.getElementById("content").style.display="none";
 document.getElementById("addBtn").style.display="none";
 document.getElementById("identity").textContent=u?` ${u.email} (確認中…)`:"";
 posts=[];reads=new Set();renderCards();status("");if(!u)return;
 if(!admin){try{
   const snap=await getDoc(doc(db,"approvedUsers",u.uid));const a=snap.exists()?snap.data():null;
   approved=!!(a&&a.approved===true&&a.uid===u.uid&&a.email===u.email&&a.role==="player");
 }catch(e){approved=false;status("承認確認エラー: "+e.message)}}
 if(version!==authVersion)return;
 document.getElementById("identity").textContent=` ${u.email} (${admin?"アナリスト":approved?"閲覧専用":"未承認"})`;
 if(!approved){status("未承認です。HGU-Labホームページで招待コードを登録してください。");return;}
 const openLibrary=()=>{
  if(version!==authVersion||!auth.currentUser||!approved)return;
  document.getElementById("content").style.display="";
  stopPosts=onSnapshot(query(collection(db,"analystLibrary"),orderBy("createdAt","desc")),s=>{posts=s.docs.map(x=>({id:x.id,...x.data()}));renderCards()},e=>status("資料取得エラー: "+e.message));
  stopReads=onSnapshot(collection(db,"users",u.uid,"analystLibraryReads"),s=>{reads=new Set(s.docs.map(x=>x.id));renderCards()},e=>status("未読取得エラー: "+e.message));
 };
 openLibrary();
});

async function markRead(id){if(!user||!approved||reads.has(id))return;try{await setDoc(doc(db,"users",user.uid,"analystLibraryReads",id),{readAt:serverTimestamp()})}catch(e){status(e.message)}}
async function removePost(id){if(!admin)return;const p=posts.find(x=>x.id===id);if(!p||!confirm("この資料の登録情報を削除しますか？（GitHub上のファイル本体は残ります）"))return;try{await deleteDoc(doc(db,"analystLibrary",id))}catch(e){status("削除エラー: "+e.message)}}
let editing=null;
function editPost(id){if(!admin)return;const p=posts.find(x=>x.id===id);if(!p)return;editing=id;const f=document.getElementById("postForm");for(const k of ["title","author","category","type","desc","url","fileUrl"])f.elements[k].value=p[k]||"";document.getElementById("modal").classList.add("show")}
const categories=["すべて","打撃分析","投手分析","チーム分析","パフォーマンス","研究・論文","面白い資料","その他"];
let posts=[];
let active="すべて";
const filters=document.getElementById("filters"),cards=document.getElementById("cards"),search=document.getElementById("search");
function renderFilters(){filters.innerHTML=categories.map(c=>`<button class="filter ${c===active?"active":""}" data-cat="${c}">${c}</button>`).join("");filters.querySelectorAll("button").forEach(b=>b.onclick=()=>{active=b.dataset.cat;renderFilters();renderCards()})}
function normalizeFileUrl(value){
 const url=safeLink(value);if(!url)return "";
 try{
   const u=new URL(url);
   // GitHubのblob/rawページではなく、公開済みGitHub PagesのPDFを直接開く
   const m=u.hostname==="github.com" && u.pathname.match(/^\/hokkaigakuen\/(data_library|data_library-test)\/(?:blob|raw)\/[^/]+\/(.+)$/);
   if(m)return `https://hokkaigakuen.github.io/${m[1]}/${m[2]}`;
   if(u.hostname==="raw.githubusercontent.com"){
     const raw=u.pathname.match(/^\/hokkaigakuen\/(data_library|data_library-test)\/[^/]+\/(.+)$/);
     if(raw)return `https://hokkaigakuen.github.io/${raw[1]}/${raw[2]}`;
   }
 }catch{}return url;
}
// GitHub上の実際のファイル名が結合文字（ク + 濁点）になっている資料だけを補正する。
// 他のPDFのファイル名やURLは一切変更しない。
function resolvePdfUrl(value){
 const url=normalizeFileUrl(value);
 if(!url)return "";
 try{
  const u=new URL(url);
  if(u.hostname==="hokkaigakuen.github.io" && u.pathname.startsWith("/data_library/")){
   const name=decodeURIComponent(u.pathname.slice("/data_library/".length));
   if(name.normalize("NFC")==="26リーグ戦を終えて打者.pdf"){
    u.pathname="/data_library/"+encodeURIComponent("26リーク\u3099戦を終えて打者.pdf");
    return u.href;
   }
  }
 }catch{}
 return url;
}
function isPdf(url){try{return decodeURIComponent(new URL(url).pathname).toLowerCase().endsWith(".pdf")}catch{return false}}
const previewModal=document.getElementById("previewModal"),previewFrame=document.getElementById("previewFrame");
function closePreview(){previewModal.classList.remove("show");previewFrame.src="about:blank"}
document.getElementById("closePreview").onclick=closePreview;
previewModal.addEventListener("click",e=>{if(e.target===previewModal)closePreview()});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closePreview()});
function openFile(id){
 const p=posts.find(x=>x.id===id);if(!p)return;
 const url=resolvePdfUrl(p.fileUrl);if(!url){status("資料URLが登録されていません。");return}
 markRead(id);
 if(!isPdf(url)){window.open(url,"_blank","noopener,noreferrer");return}
 document.getElementById("previewTitle").textContent=p.title||"PDFプレビュー";
 document.getElementById("previewHint").textContent="ブラウザ標準のPDF表示で開いています。表示できない場合は「別タブで開く」をお試しください。";
 document.getElementById("previewExternal").href=url;
 previewFrame.removeAttribute("src");
 previewFrame.src=url;
 previewModal.classList.add("show");
}
function renderCards(){
 const q=search.value.toLowerCase().trim(),unread=posts.filter(p=>!reads.has(p.id)).length;
 document.getElementById("unreadCount").textContent=`未読資料 ${unread}件`;
 const list=posts.filter(p=>(active==="すべて"||p.category===active)&&(!onlyUnread||!reads.has(p.id))&&[p.title,p.desc,p.author,p.category,p.type,p.fileName].join(" ").toLowerCase().includes(q));
 document.getElementById("count").textContent=`${list.length} 件（登録総数 ${posts.length} 件）`;
 cards.innerHTML=list.length?list.map(p=>{
 const fileUrl=resolvePdfUrl(p.fileUrl),link=safeLink(p.url);
 return `<article class="card"><div class="cardtop"><span class="category">${esc(p.category)}</span><span class="type">${esc(p.type)}</span>${!reads.has(p.id)?'<b style="color:#c47b00">未読</b>':""}</div><h3>${esc(p.title)}</h3><p class="desc">${esc(p.desc)}</p><div class="meta"><span>${esc(p.author)} · ${p.createdAt?.toDate?.().toLocaleDateString("ja-JP")||""}</span><span>${fileUrl?`<button class="secondary" style="padding:7px 10px" data-open="${esc(p.id)}">${isPdf(fileUrl)?"PDFをサイト内で見る":"ファイルを開く"}</button>`:""} ${link?`<a class="open" href="${esc(link)}" target="_blank" rel="noopener noreferrer" data-linkread="${esc(p.id)}">リンク ↗</a>`:""}</span></div><div class="cardactions">${reads.has(p.id)?'<span class="type">既読</span>':`<button class="secondary" data-read="${esc(p.id)}">既読にする</button>`}${admin?`<button class="secondary" data-edit="${esc(p.id)}">編集</button><button class="secondary" data-delete="${esc(p.id)}">削除</button>`:""}</div></article>`;
 }).join(""):`<div class="empty">${posts.length?"検索条件に一致する資料はありません。":"資料はまだ登録されていません。"}</div>`;
 cards.querySelectorAll("[data-open]").forEach(x=>x.onclick=()=>openFile(x.dataset.open));
 cards.querySelectorAll("[data-linkread]").forEach(x=>x.onclick=()=>markRead(x.dataset.linkread));
 cards.querySelectorAll("[data-read]").forEach(x=>x.onclick=()=>markRead(x.dataset.read));
 cards.querySelectorAll("[data-edit]").forEach(x=>x.onclick=()=>editPost(x.dataset.edit));
 cards.querySelectorAll("[data-delete]").forEach(x=>x.onclick=()=>removePost(x.dataset.delete));
}

function safeLink(s){try{const u=new URL(s);return ["https:","http:"].includes(u.protocol)?u.href:""}catch{return ""}}
function esc(s){return String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
const modal=document.getElementById("modal");
document.getElementById("addBtn").onclick=()=>{editing=null;document.getElementById("postForm").reset();modal.classList.add("show")};
document.getElementById("cancel").onclick=()=>modal.classList.remove("show");
modal.onclick=e=>{if(e.target===modal)modal.classList.remove("show")};search.oninput=renderCards;
document.getElementById("postForm").onsubmit=async e=>{
e.preventDefault();if(!admin)return;
const f=e.target,d=new FormData(f),old=posts.find(p=>p.id===editing),btn=f.querySelector('[type="submit"]');
btn.disabled=true;btn.textContent="保存中…";
try{
const fileUrl=resolvePdfUrl(String(d.get("fileUrl")||"").trim()),externalUrl=String(d.get("url")||"").trim();
if(fileUrl&&!isPdf(fileUrl))throw Error("資料ファイルはPDFの公開URLを登録してください（.pdf）。");
for(const value of [fileUrl,externalUrl]){if(value){const parsed=new URL(value);if(!["https:","http:"].includes(parsed.protocol))throw Error("URLはhttp/httpsのみ利用できます");}}
const data={title:d.get("title"),author:d.get("author"),category:d.get("category"),type:d.get("type"),desc:d.get("desc"),url:externalUrl,fileUrl,storagePath:"",fileName:fileUrl?decodeURIComponent(new URL(fileUrl).pathname.split("/").pop()):"",updatedAt:serverTimestamp()};
if(editing){await updateDoc(doc(db,"analystLibrary",editing),data)}
else{data.createdAt=serverTimestamp();await addDoc(collection(db,"analystLibrary"),data)}

modal.classList.remove("show");f.reset();editing=null;status("");
}catch(err){status("保存エラー: "+err.message)}
finally{btn.disabled=false;btn.textContent="投稿する"}
};
renderFilters();renderCards();
</script>
</body>
</html>
